name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false


jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Spa MCP Worker
        run: npm run check --workspace=@allstay/spa-worker

      - name: Deploy Spa MCP Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.115.0"
          workingDirectory: apps/spa-worker
          command: deploy --config wrangler.jsonc --keep-vars
          secrets: |
            MCP_API_TOKEN
        env:
          MCP_API_TOKEN: ${{ secrets.SPA_MCP_SHARED_TOKEN }}

      - name: Apply Spa D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.115.0"
          workingDirectory: apps/spa-worker
          command: d1 migrations apply allstay-spa --remote --config wrangler.jsonc

      - name: Build tablet app
        run: npm run build --workspace=apps/tablet

      - name: Smoke test tablet SSR
        shell: bash
        run: |
          npm run preview --workspace=apps/tablet -- --host 127.0.0.1 --port 4173 > /tmp/allstay-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          curl --fail --silent --show-error \
            --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:4173/login > /tmp/allstay-login.html

          grep -q "Everything for your trip" /tmp/allstay-login.html || {
            cat /tmp/allstay-preview.log
            exit 1
          }

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.115.0"
          workingDirectory: apps/tablet
          command: deploy --config wrangler.jsonc
          secrets: |
            MCP_SPA_API_TOKEN
        env:
          MCP_SPA_API_TOKEN: ${{ secrets.SPA_MCP_SHARED_TOKEN }}

      - name: Smoke test deployed Spa integration
        shell: bash
        run: |
          tablet_url="https://allstay-tablet.wangchang0409.workers.dev"

          curl --fail --silent --show-error \
            --cookie-jar /tmp/allstay-tablet.cookies \
            --header "Origin: ${tablet_url}" \
            --header "Referer: ${tablet_url}/login" \
            --data "staffId=deployment-smoke" \
            --data "pin=1234" \
            "${tablet_url}/login" > /dev/null

          curl --fail --silent --show-error \
            --cookie /tmp/allstay-tablet.cookies \
            "${tablet_url}/api/spa?serviceId=balinese-massage&date=2026-08-01" \
            | grep -q '"slots"'
